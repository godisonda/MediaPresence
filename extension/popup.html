<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #18181b; color: #f4f4f5; padding: 14px; margin: 0; }
    h3 { margin: 0 0 10px 0; font-size: 13px; text-align: center; letter-spacing: 0.5px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 10px; border: 1px solid #27272a; border-radius: 6px; background: #09090b; color: #fff; font-size: 15px; font-family: monospace; text-align: center; text-transform: uppercase; outline: none; }
    input:focus { border-color: #6366f1; }
    button { width: 100%; padding: 8px; background: #4f46e5; border: none; border-radius: 6px; color: #fff; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #4338ca; }
    #msg { font-size: 11px; text-align: center; margin-top: 8px; color: #22c55e; }
  </style>
</head>
<body>
  <h3>Код авторизации</h3>
  <input type="text" id="token" placeholder="Введите код из app" maxlength="8">
  <button id="saveBtn">Сохранить</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
